services:
  mariadb:
    image: mariadb:11
    container_name: stobot-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: stobot
      MARIADB_USER: stobot
      MARIADB_PASSWORD: stobotpass
    ports:
      - "3306:3306"
    volumes:
      - stobot_db:/var/lib/mysql

  stobot:
    build: .
    container_name: stobot-app
    depends_on:
      - mariadb
    environment:
      # DB
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/stobot
      SPRING_DATASOURCE_USERNAME: stobot
      SPRING_DATASOURCE_PASSWORD: stobotpass

      # Discord
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD: ${DISCORD_GUILD}

      # Spring
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_PROFILES_ACTIVE: dev
    restart: unless-stopped

volumes:
  stobot_db:
